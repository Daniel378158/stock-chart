<style>
.stock-search{padding:14px 26px 10px;border-bottom:1px solid #232c3b;background:#101620;color:#dce4f0;font:13px/1.5 system-ui,"Microsoft JhengHei",sans-serif}.search-row{display:flex;align-items:center;gap:12px}.search-row label{font-weight:600;white-space:nowrap}.search-box{display:flex;max-width:530px;width:100%;gap:8px}.search-box input{flex:1;min-width:0;background:#0b0f16;border:1px solid #374150;border-radius:6px;color:#e5ecf7;padding:9px 12px;font:inherit;outline:none}.search-box input:focus{border-color:#ffca67;box-shadow:0 0 0 2px #ffca6715}.search-box button{background:#ffca67;color:#21190d;border:1px solid #ffca67;font-weight:600;padding:8px 18px;border-radius:6px;white-space:nowrap;font:inherit;cursor:pointer}.search-box button:disabled{opacity:.55;cursor:wait}.search-hint{color:#8692a6;font-size:11px}.search-message{font-size:12px;color:#ffca67;min-height:0;margin:0}.search-message:not(:empty){margin-top:8px}.search-message[data-error=true]{color:#ff96a3}.history-row{display:flex;align-items:center;gap:10px;margin-top:10px}.history-label{font-size:11px;color:#8692a6;white-space:nowrap}.history-items{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px 0 5px}.history-item{display:flex;flex:none;border:1px solid #303b4c;border-radius:5px;background:#171e2a;overflow:hidden}.history-item button{border:0;background:transparent;color:#c0cede;font:11px/1.5 system-ui;cursor:pointer;padding:4px 9px}.history-item button:hover{background:#29364a;color:#ffca67}.history-item .remove-history{color:#7f8da4;padding:4px 6px;border-left:1px solid #303b4c}.history-empty{color:#647289;font-size:11px;padding:5px 0}.clear-history{border:0;background:none;color:#95a4bb;white-space:nowrap;font:11px system-ui;cursor:pointer;padding:5px}.clear-history:disabled{opacity:.4;cursor:default}.stock-search~main{height:calc(100vh - 207px)}@media(max-width:980px){.search-hint{display:none}}@media(max-width:720px){.stock-search{padding:12px 16px}.search-row{align-items:flex-start;flex-direction:column;gap:6px}.search-box{max-width:none}.stock-search~main{height:auto}.history-row{gap:7px}}
</style>
<section class="stock-search" aria-label="股票搜尋">
 <form id="stock-search-form" class="search-row" role="search">
  <label for="stock-symbol">搜尋股票</label>
  <div class="search-box"><input id="stock-symbol" name="symbol" type="search" placeholder="輸入代碼，例如 MU、2330、6488" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" required aria-describedby="search-message"><button id="search-submit" type="submit">搜尋</button></div>
  <span class="search-hint">美股代碼 / 台股數字 · Enter 搜尋</span>
 </form>
 <p id="search-message" class="search-message" role="status" aria-live="polite"></p>
 <div class="history-row"><span class="history-label">最近搜尋</span><div id="search-history" class="history-items"></div><button type="button" id="clear-history" class="clear-history" disabled>清除全部</button></div>
</section>
<script>
(() => {
 'use strict';
 const KEY='stock-chart.search-history.v1',LIMIT=20;
 const form=document.getElementById('stock-search-form'),input=document.getElementById('stock-symbol');
 const submit=document.getElementById('search-submit'),message=document.getElementById('search-message');
 const list=document.getElementById('search-history'),clear=document.getElementById('clear-history');
 const valid=s=>typeof s==='string'&&/^[A-Z0-9][A-Z0-9.^=\-]{0,31}$/.test(s);
 let history=[],busy=false,storageAvailable=true;
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'[]');
  const seen=new Set();
  if(Array.isArray(saved))history=saved.filter(x=>x&&valid(x.symbol)&&!seen.has(x.symbol)&&seen.add(x.symbol)).slice(0,LIMIT).map(x=>({symbol:x.symbol,name:typeof x.name==='string'?x.name:'',searchedAt:x.searchedAt}));
 }catch{history=[];}
 function status(value,error=false){message.textContent=value;message.dataset.error=String(error);}
 function persist(){try{localStorage.setItem(KEY,JSON.stringify(history));}catch{storageAvailable=false;}renderHistory();}
 function renderHistory(){
  list.replaceChildren();clear.disabled=history.length===0||busy;
  if(!history.length){const empty=document.createElement('span');empty.className='history-empty';empty.textContent='尚無搜尋紀錄';list.append(empty);return;}
  for(const item of history){
   const chip=document.createElement('span');chip.className='history-item';
   const open=document.createElement('button');open.type='button';open.textContent=item.symbol;open.disabled=busy;
   open.title=[item.symbol,item.name].filter(Boolean).join(' · ');open.setAttribute('aria-label',`搜尋 ${item.symbol}`);
   open.onclick=()=>search(item.symbol);
   const remove=document.createElement('button');remove.type='button';remove.className='remove-history';remove.textContent='×';remove.disabled=busy;
   remove.setAttribute('aria-label',`移除 ${item.symbol} 搜尋紀錄`);remove.onclick=()=>{history=history.filter(x=>x.symbol!==item.symbol);persist();};
   chip.append(open,remove);list.append(chip);
  }
 }
 async function search(raw){
  if(busy)return;
  const symbol=raw.trim().toUpperCase();input.value=symbol;
  if(!valid(symbol)){status('請輸入一個有效股票代碼，例如 MU、2330 或 6488.TWO。',true);input.focus();return;}
  if(!['http:','https:'].includes(location.protocol)){
   status('網頁搜尋需要本機服務：在 stock-chart 資料夾執行 python server.py，再開啟 http://127.0.0.1:8765。',true);return;
  }
  busy=true;submit.disabled=true;input.disabled=true;submit.textContent='載入中…';form.setAttribute('aria-busy','true');renderHistory();
  status(`正在取得 ${symbol} 的日K資料…`);
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);
  try{
   const response=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol}),signal:controller.signal});
   if(!response.headers.get('content-type')?.includes('application/json'))throw new Error('搜尋服務尚未啟動，請使用 python server.py 開啟此網站。');
   const result=await response.json();
   if(!response.ok)throw new Error(result.error||'搜尋失敗，請稍後重試。');
   const currentUrl=`/chart/${encodeURIComponent(result.symbol)}`,legacyUrl=`/${encodeURIComponent(result.symbol)}_chart.html`;
   if(!valid(result.symbol)||![currentUrl,legacyUrl].includes(result.url))throw new Error('搜尋服務回傳格式不正確。');
   history=[{symbol:result.symbol,name:result.name||'',searchedAt:new Date().toISOString()},...history.filter(x=>x.symbol!==result.symbol)].slice(0,LIMIT);
   persist();status(storageAvailable?`已找到 ${result.symbol}，正在開啟圖表…`:'已找到股票；瀏覽器無法保存紀錄，正在開啟圖表…');
   location.assign(result.url);
  }catch(error){
   status(error.name==='AbortError'?'查詢逾時，請稍後再試。':error instanceof TypeError?'無法連線到搜尋服務，請確認 python server.py 仍在執行。':error.message,true);
  }finally{
   clearTimeout(timer);busy=false;submit.disabled=false;input.disabled=false;submit.textContent='搜尋';form.removeAttribute('aria-busy');renderHistory();
  }
 }
 form.addEventListener('submit',event=>{event.preventDefault();search(input.value);});
 clear.onclick=()=>{history=[];persist();};
 window.addEventListener('storage',event=>{if(event.key===KEY)location.reload();});
 renderHistory();
})();
</script>
